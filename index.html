<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Vanshika Kapur — Data analyst · process mining · business intelligence</title>
    <meta
      name="description"
      content="Vanshika Kapur mines event logs for the step that is quietly costing the most, then builds the dashboard that makes the fix obvious. MS Data Science, Indiana University. Previously Vertiv and Celonis."
    />
    <link rel="canonical" href="https://vanshikakapur.github.io/portfolio/" />

    <!-- rel=icon is rebased onto `base` by Vite; apple-touch-icon is not on its
         rewrite list, so it carries the absolute URL like the OG tags do.
         scripts/postbuild.mjs fails the build if these drift from `base`. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="https://vanshikakapur.github.io/portfolio/og.png" />

    <meta property="og:type" content="profile" />
    <meta property="og:title" content="Vanshika Kapur — Data analyst" />
    <meta
      property="og:description"
      content="Event logs, process models, and dashboards that end in a decision. MS Data Science, Indiana University Bloomington."
    />
    <meta property="og:url" content="https://vanshikakapur.github.io/portfolio/" />
    <meta property="og:image" content="https://vanshikakapur.github.io/portfolio/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A discovered process model of Vanshika Kapur's career, drawn as connected nodes on a bone-coloured field."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Colour mode is applied before first paint so the page never flashes the
         wrong surface. Mirrors the logic in src/lib/useTheme.ts. -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('vk-theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.dataset.theme = theme
        } catch (e) {
          /* private mode: the light default in the markup stands */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
